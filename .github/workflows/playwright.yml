name: Playwright Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar dependencias de forma determinista
        run: npm ci

      - name: Instalar navegadores de Playwright con dependencias del sistema
        run: npx playwright install --with-deps

      - name: Ejecutar pruebas de Playwright
        run: npx playwright test

      - name: Subir reporte HTML ante fallos o éxito
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14